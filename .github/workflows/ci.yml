name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.11"

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check go.mod
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Staticcheck
        run: staticcheck ./...

      - name: Govulncheck
        run: govulncheck ./...

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m --enable=gosec,errcheck,bodyclose,noctx,contextcheck

  integration:
    name: Integration with ClickHouse
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: exporter
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user default --password exporter --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Integration test
        env:
          CLICKHOUSE_DSN: clickhouse://default:exporter@127.0.0.1:9000/default
        run: go test -tags=integration -v ./internal/collector

      - name: Exporter smoke test
        env:
          CLICKHOUSE_DSN: clickhouse://default:exporter@127.0.0.1:9000/default
        run: |
          go build -o /tmp/clickhouse-exporter ./cmd/clickhouse-exporter
          /tmp/clickhouse-exporter --listen-address :19116 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19116/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:19116/readyz
          curl -fsS http://127.0.0.1:19116/metrics | grep -q '^chx_clickhouse_exporter_build_info'

  manifests:
    name: Manifests and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint
        run: |
          helm lint --strict deploy/helm/clickhouse-exporter \
            --set clickhouse.dsn='clickhouse://exporter@clickhouse:9000/default'

      - name: Helm template (chart-managed secret)
        run: |
          helm template ci deploy/helm/clickhouse-exporter \
            --set clickhouse.dsn='clickhouse://exporter@clickhouse:9000/default' \
            > /tmp/clickhouse-exporter.yaml

      - name: Helm template (existing secret and ServiceMonitor)
        run: |
          helm template ci deploy/helm/clickhouse-exporter \
            --set clickhouse.existingSecret=clickhouse-dsn \
            --set serviceMonitor.enabled=true \
            > /tmp/clickhouse-exporter-existing.yaml

      - name: Validate dashboards JSON
        run: |
          python3 -m json.tool deploy/grafana/dashboards/clickhouse.json > /dev/null
          python3 -m json.tool deploy/grafana/import/clickhouse.json > /dev/null

      - name: Validate compose
        run: docker compose -f deploy/docker-compose.yml config > /dev/null

      - name: Validate Prometheus rules
        run: |
          docker run --rm \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1 \
            check rules /etc/prometheus/rules/clickhouse.yml

      - name: Build Docker image
        run: docker build -t clickhouse-exporter:ci .
