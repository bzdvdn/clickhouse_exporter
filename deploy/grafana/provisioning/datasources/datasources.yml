apiVersion: 1

# Remove a previously provisioned ClickHouse datasource, so Grafana no longer
# holds ClickHouse credentials. Only the exporter talks to ClickHouse.
deleteDatasources:
  - name: ClickHouse
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
