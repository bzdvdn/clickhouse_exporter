{{- if and (not .Values.clickhouse.existingSecret) (not .Values.clickhouse.dsn) }}
{{- fail "clickhouse.existingSecret or clickhouse.dsn is required" }}
{{- end }}
{{- if and (not .Values.clickhouse.existingSecret) .Values.clickhouse.dsn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse-exporter.fullname" . }}
  labels:
    {{- include "clickhouse-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.clickhouse.secretKey }}: {{ .Values.clickhouse.dsn | quote }}
{{- end }}
