replicaCount: 1

image:
  repository: ghcr.io/bzdvdn/clickhouse_exporter
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9116
  annotations: {}

# Prometheus Operator support. Enable if the ServiceMonitor CRD is installed.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  additionalLabels: {}
  relabelings: []
  metricRelabelings: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
terminationGracePeriodSeconds: 20
extraEnv: []

# The DSN is passed through CLICKHOUSE_DSN so it never lands in a ConfigMap.
# In production use existingSecret:
#   kubectl create secret generic clickhouse-exporter-dsn \
#     --from-literal=dsn='clickhouse://exporter:secret@ch-1:9000/default'
clickhouse:
  existingSecret: ""
  secretKey: dsn
  # Used only when existingSecret is empty; the chart creates a Secret.
  dsn: ""

config:
  listen_address: ":9116"
  log_level: info
  metric_prefix: chx_
  clickhouse:
    dsn: "" # supplied by CLICKHOUSE_DSN
    timeout: 5s
    settings:
      max_execution_time: 4
      max_threads: 2
      max_result_rows: 20000
      result_overflow_mode: break
      log_queries: 0
      log_query_threads: 0
  labels: {}
  collectors:
    node:
      enabled: true
      interval: 15s
    query_load:
      enabled: true
      interval: 15s
    workload:
      enabled: true
      interval: 30s
    tables:
      enabled: true
      interval: 60s
    replication:
      enabled: true
      interval: 30s
  workload:
    window: 5m
    latency_window: 15m
    top_n: 200
    exclude_users: []
  tables:
    window: 5m
    top_n: 200
    exclude_databases:
      - system
      - INFORMATION_SCHEMA
      - information_schema
    exclude_tables: []
  replication:
    top_n: 500
