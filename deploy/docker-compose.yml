name: clickhouse-monitoring

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    # Demo only: the init script creates an exporter user without a password
    # and grants SELECT on *.*.
    ports:
      - "19000:9000"
      - "18123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  exporter:
    build:
      context: ..
      args:
        VERSION: dev
    environment:
      # Set CLICKHOUSE_DSN in the environment (or a secret manager) for a real
      # cluster. The default points at the demo ClickHouse service.
      CLICKHOUSE_DSN: "${CLICKHOUSE_DSN:-clickhouse://exporter@clickhouse:9000/default}"
      CLICKHOUSE_EXPORTER_LISTEN: ":9116"
    ports:
      - "9116:9116"
    depends_on:
      clickhouse:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:11.2.0
    # Demo only: anonymous viewer with a fixed admin password.
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "13000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  clickhouse-data:
  prometheus-data:
  grafana-data:
